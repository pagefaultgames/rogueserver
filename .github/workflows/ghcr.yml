name: Publish to GHCR

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  changes:
    uses: ./.github/workflows/filter-changes.yml
    permissions:
      pull-requests: read
      contents: read

  build:
    needs: changes
    name: Build and publish to GHCR (${{ matrix.variant }})
    if: needs.changes.outputs.ghcr == 'true' && github.repository == 'pagefaultgames/rogueserver'
    env:
      GO_VERSION: 1.22
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: prod
            build_tags: devsetup
            tag_suffix: ""
          - variant: beta
            build_tags: devsetup,beta
            tag_suffix: -beta
    steps:
      - name: Setup Docker BuildX
        uses: docker/setup-buildx-action@v3
      - name: Log into container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=${{ matrix.tag_suffix }},onlatest=true
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            BUILD_TAGS=${{ matrix.build_tags }}
            VERSION=${{ github.ref_name }}-SNAPSHOT
            COMMIT_SHA=${{ env.GITHUB_SHA_SHORT }}