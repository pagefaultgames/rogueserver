name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/filter-changes.yml
    permissions:
      pull-requests: read
      contents: read
  build:
    needs: changes
    if: needs.changes.outputs.ci == 'true' && github.repository == 'pagefaultgames/rogueserver'
    name: Build (${{ matrix.platform.os_name }}, ${{ matrix.variant.name }})
    env:
      GO_VERSION: 1.22
      GOOS: ${{ matrix.platform.os_name }}
      GOARCH: ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            os_name: linux
            arch: amd64
          - os: windows-latest
            os_name: windows
            arch: amd64
          # TODO macos needs universal binary!
          # - os: macos-latest
          #   os_name: macos
        variant:
          - name: prod
            tags: ""
            artifact_suffix: ""
          - name: beta
            tags: beta
            artifact_suffix: -beta
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install dependencies
        run: go mod download
      - name: Lint Codebase
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --config .golangci.yml --build-tags=${{ matrix.variant.tags }}
      - name: Test
        run: go test -tags=${{ matrix.variant.tags }} -v ./...
      - name: Build
        run: go build -tags=${{ matrix.variant.tags }} -v
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rogueserver-${{ matrix.platform.os_name }}-${{ matrix.platform.arch }}${{ matrix.variant.artifact_suffix }}-${{ github.sha }}
          path: |
            rogueserver*
            !rogueserver.go